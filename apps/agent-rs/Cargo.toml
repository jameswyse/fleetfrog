[package]
name = "fleetfrog-agent"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "The FleetFrog agent, in Rust: reports a development machine's repositories to a FleetFrog hub."
license = "MIT"
publish = false

[[bin]]
name = "fleetfrog"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Pinned to the release that accepts only ASCII host names, which keeps Unicode tables out of the
# binary. Remote hosts are ASCII in practice, and a Unicode one is refused rather than misread.
idna_adapter = "=1.0.0"
libc = "0.2.189"
ring = "0.17.14"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
webpki-roots = "1.0.9"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
