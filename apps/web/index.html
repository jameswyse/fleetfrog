<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FleetFrog</title>
    <script>
      // Applies this browser's preferences before the first paint, so the page never flashes the
      // other colour scheme or personal details. src/features/preferences/preferences.ts owns them.
      try {
        const colorScheme = localStorage.getItem("fleetfrog.colorScheme");

        if (colorScheme === "light" || colorScheme === "dark") {
          document.documentElement.dataset.colorScheme = colorScheme;
        }

        document.documentElement.toggleAttribute(
          "data-blur-personal",
          localStorage.getItem("fleetfrog.blurPersonal") === "on",
        );
      } catch {
        // Storage is blocked, so the page keeps the system's colours.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
