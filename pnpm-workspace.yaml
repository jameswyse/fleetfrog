packages:
  - apps/*
  - packages/*

cargo:
  enabled: true

catalog:
  "@effect/platform-node": 4.0.0
  "@effect/sql-sqlite-node": 4.0.0
  "@effect/tsgo": 0.47.1
  "@effect/vitest": 4.0.0
  "@oxlint/plugins": 1.86.0
  "@types/node": 26.6.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.0.0
  openid-client: 6.8.8
  oxfmt: 0.71.0
  # The root prepare script runs `effect-tsgo patch --oxlint`, which fails on oxlint versions newer
  # than the pinned @effect/tsgo supports. Move oxlint and @oxlint/plugins only as far as it allows.
  oxlint: 1.86.0
  react: 19.3.0
  react-dom: 19.3.0
  tsdown: 0.23.0
  typescript: 7.0.2
  vitest: 5.0.2

minimumReleaseAge: 1440
# Exact versions approved before they were a day old. pnpm prunes each entry once the lockfile
# stops resolving that version.
minimumReleaseAgeExclude:
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/sql-sqlite-node@4.0.0"
  - "@effect/vitest@4.0.0"
  - "effect@4.0.0"
  - "@oxfmt/binding-android-arm-eabi@0.71.0"
  - "@oxfmt/binding-android-arm64@0.71.0"
  - "@oxfmt/binding-darwin-arm64@0.71.0"
  - "@oxfmt/binding-darwin-x64@0.71.0"
  - "@oxfmt/binding-freebsd-x64@0.71.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.71.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.71.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.71.0"
  - "@oxfmt/binding-linux-arm64-musl@0.71.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.71.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.71.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.71.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.71.0"
  - "@oxfmt/binding-linux-x64-gnu@0.71.0"
  - "@oxfmt/binding-linux-x64-musl@0.71.0"
  - "@oxfmt/binding-openharmony-arm64@0.71.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.71.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.71.0"
  - "@oxfmt/binding-win32-x64-msvc@0.71.0"
  - "oxfmt@0.71.0"
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
# Wrangler, for the website, runs without these packages' install scripts: pnpm installs their
# binaries as platform packages.
allowBuilds:
  esbuild: false
  workerd: false
blockExoticSubdeps: true
savePrefix: ""
cleanupUnusedCatalogs: true

update:
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"
