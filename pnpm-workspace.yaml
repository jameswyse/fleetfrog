packages:
  - apps/*
  - packages/*

cargo:
  enabled: true

catalog:
  "@effect/platform-node": 4.1.4
  "@effect/sql-sqlite-node": 4.1.4
  "@effect/tsgo": 0.70.0
  "@effect/vitest": 4.1.4
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  effect: 4.1.4
  openid-client: 6.9.0
  oxfmt: 0.79.0
  oxlint: 1.94.0
  react: 19.3.1
  react-dom: 19.3.1
  tsdown: 0.23.7
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@jameswyse/oxc-config@2.0.0"
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
trustPolicyExclude:
  - "tsrs@7.1.0-beta.tsrs3"
strictDepBuilds: true
# Wrangler, for the website, runs without these packages' install scripts: pnpm installs their
# binaries as platform packages.
allowBuilds:
  esbuild: false
  workerd: false
blockExoticSubdeps: true
savePrefix: ""
catalogPrune: true

update:
  githubActions: true
  ignoreDeps:
    # Node types follow the pinned Node major rather than DefinitelyTyped's latest major.
    - "@types/node"
