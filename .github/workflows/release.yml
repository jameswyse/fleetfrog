# While changesets are pending, keeps a Version packages pull request up to date. Merging it
# releases that version: the agent binaries and the hub image are built, then published together
# with a GitHub release. docs/releasing.md explains the process.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jameswyse/fleetfrog-hub

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The workflow's own token can't start CI on a pull request it opens, so the release app's
      # token opens the Version packages pull request.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: sh scripts/release/version.sh
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
      # With no changesets pending, the version in the manifests is released unless it already is.
      - id: release
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version apps/hub/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$version" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  agent:
    name: Agent for ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - asset: fleetfrog-linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - asset: fleetfrog-linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - asset: fleetfrog-macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux builds link musl statically, so the binary runs on any distribution.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
        working-directory: apps/agent-rs
      # pnpm install vendors the crates Cargo builds from.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      # Marks the binary as a release build, which can update itself to a later release.
      - working-directory: apps/agent-rs
        env:
          FLEETFROG_RELEASE: "1"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/fleetfrog ${{ matrix.asset }}
          test "$(./${{ matrix.asset }} --version)" = "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: apps/agent-rs/${{ matrix.asset }}
          if-no-files-found: error

  hub-image:
    name: Hub image for ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed without a tag. The manifest job tags both platforms together once every build passes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: apps/hub/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hub-${{ matrix.arch }}
          cache-to: type=gha,scope=hub-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  hub-manifest:
    name: Hub image tags
    needs: [version, agent, hub-image]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: [version, agent, hub-manifest]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: fleetfrog-*
          merge-multiple: true
      - working-directory: assets
        run: |
          cp ../scripts/release/install.sh .
          sha256sum fleetfrog-* install.sh > SHA256SUMS
      # Signs the checksums, which install.sh and the agent check before trusting them. The
      # signature is then checked against the key in install.sh, so a wrong secret fails the
      # release before anything is published.
      - working-directory: assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is empty."
            exit 1
          fi
          umask 077
          key=$(mktemp "$RUNNER_TEMP/signing-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -Y sign -f "$key" -n fleetfrog-release SHA256SUMS
          rm -f "$key"
          release_key=$(sed -n 's/^release_key="\(.*\)"$/\1/p' install.sh)
          echo "releases@fleetfrog.dev $release_key" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I releases@fleetfrog.dev \
            -n fleetfrog-release -s SHA256SUMS.sig < SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/fleetfrog-*
            assets/SHA256SUMS
            assets/SHA256SUMS.sig
            assets/install.sh
      # Creating the release creates its tag, so a failed build leaves nothing to clean up.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release/notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "FleetFrog $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Point the website branch at the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/website" \
            -f sha="$GITHUB_SHA" -F force=true
